name: HexaWars runner isolation gate

on:
  pull_request:
    paths:
      - "src/runner/**"
      - "src/gateway/observation.ts"
      - "tests/runner/**"
      - "tests/gateway/observation.test.ts"
      - ".github/workflows/runner-isolation-gate.yml"
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: hexawars-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true


jobs:
  seat-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: "1.3.3"
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Assert competitive seat privacy and real response channel
        run: bun test tests/gateway/observation.test.ts tests/runner/runner.test.ts
