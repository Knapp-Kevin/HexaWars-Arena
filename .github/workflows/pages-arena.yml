name: GitHub Pages browser arena

on:
  pull_request:
    paths:
      - "src/public/**"
      - "src/browser/**"
      - "src/vendor/verdant/**"
      - "src/projection/**"
      - "src/shared/public-match.ts"
      - "scripts/build-pages.mjs"
      - "scripts/verify-pages.mjs"
      - ".github/workflows/pages-arena.yml"
  push:
    branches: [main]
    paths:
      - "src/public/**"
      - "src/browser/**"
      - "src/vendor/verdant/**"
      - "src/projection/**"
      - "src/shared/public-match.ts"
      - "scripts/build-pages.mjs"
      - "scripts/verify-pages.mjs"
      - ".github/workflows/pages-arena.yml"
  workflow_dispatch:

concurrency:
  group: hexawars-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: "1.3.3"
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Build Pages static site
        run: bun scripts/build-pages.mjs
      - name: Verify published assets and no private files
        run: node scripts/verify-pages.mjs
      - name: Upload GitHub Pages artifact (main only)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/pages

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified static site
        id: deployment
        uses: actions/deploy-pages@v4
