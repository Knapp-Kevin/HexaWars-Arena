name: GitHub Pages browser arena

on:
  pull_request:
    paths:
      - "src/public/**"
      - "src/browser/**"
      - "src/vendor/verdant/**"
      - "src/projection/**"
      - "src/shared/public-match.ts"
      - "scripts/build-pages.mjs"
      - "scripts/verify-pages.mjs"
      - ".github/workflows/pages-arena.yml"
  push:
    branches: [main]
    paths:
      - "src/public/**"
      - "src/browser/**"
      - "src/vendor/verdant/**"
      - "src/projection/**"
      - "src/shared/public-match.ts"
      - "scripts/build-pages.mjs"
      - "scripts/verify-pages.mjs"
      - ".github/workflows/pages-arena.yml"
  workflow_dispatch:

concurrency:
  group: hexawars-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Use pinned Node.js 24 (no Bun or external packages)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.11.1"
      - name: Build static ES modules and Verdant viewport
        run: node scripts/build-pages.mjs
      - name: Verify imports, replay data, Verdant and zero private files
        run: node scripts/verify-pages.mjs
      - name: Parse-check browser output
        run: |
          for f in dist/pages/*.js dist/pages/*.mjs; do node --check "$f"; done
      - name: Upload GitHub Pages artifact (main only)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/pages

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified static site
        id: deployment
        uses: actions/deploy-pages@v4
