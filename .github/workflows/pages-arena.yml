name: GitHub Pages browser arena

on:
  pull_request:
    paths:
      - "src/public/**"
      - "src/browser/**"
      - "src/vendor/verdant/**"
      - "src/projection/**"
      - "src/shared/public-match.ts"
      - "scripts/build-pages.mjs"
      - "scripts/verify-pages.mjs"
      - "qa/**"
      - ".github/workflows/pages-arena.yml"
  push:
    branches: [main]
    paths:
      - "src/public/**"
      - "src/browser/**"
      - "src/vendor/verdant/**"
      - "src/projection/**"
      - "src/shared/public-match.ts"
      - "scripts/build-pages.mjs"
      - "scripts/verify-pages.mjs"
      - "qa/**"
      - ".github/workflows/pages-arena.yml"
  workflow_dispatch:

concurrency:
  group: hexawars-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Use pinned Node.js 24 (no Bun or external packages)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.11.1"
      - name: Build static ES modules and Verdant viewport
        run: node scripts/build-pages.mjs
      - name: Verify imports, replay data, Verdant and zero private files
        run: node scripts/verify-pages.mjs
      - name: Test symmetric map and deterministic detailed meshes
        run: node --test qa/scene-geometry.test.mjs
      - name: Parse-check browser output
        run: |
          for f in dist/pages/*.js dist/pages/*.mjs; do node --check "$f"; done
          node --check qa/browser-smoke.mjs
      - name: Install pinned browser acceptance harness (test-only)
        run: npm --prefix qa install --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Verify Chrome is available
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          test -x "$CHROME_BIN"
          "$CHROME_BIN" --version
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: Real browser test of local static artifact
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory dist/pages > "$RUNNER_TEMP/hexawars-http.log" 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8765/ >/dev/null; then break; fi
            sleep 1
          done
          HEXAWARS_BASE_URL=http://127.0.0.1:8765/ node qa/browser-smoke.mjs
      - name: Preserve browser screenshots for review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pages-browser-smoke-${{ github.run_id }}
          path: browser-acceptance/
          retention-days: 7
          if-no-files-found: ignore
      - name: Upload GitHub Pages artifact (main only)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/pages

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified static site
        id: deployment
        uses: actions/deploy-pages@v4

  published-smoke:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.11.1"
      - name: Install test-only browser harness
        run: npm --prefix qa install --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Select Chrome browser
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          test -x "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: Ensure GitHub Pages published all required assets
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent --location https://knapp-kevin.github.io/HexaWars-Arena/ > /dev/null &&
               curl --fail --silent --location https://knapp-kevin.github.io/HexaWars-Arena/verdant.html > /dev/null &&
               curl --fail --silent --location https://knapp-kevin.github.io/HexaWars-Arena/scene-renderer.mjs > /dev/null; then
               exit 0
            fi
            sleep 2
          done
          echo "Public GitHub Pages assets not reachable" >&2
          exit 1
      - name: Real browser test of public GitHub Pages release
        env:
          HEXAWARS_BASE_URL: https://knapp-kevin.github.io/HexaWars-Arena/
        run: node qa/browser-smoke.mjs
      - name: Attach published-site screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pages-public-smoke-${{ github.run_id }}
          path: browser-acceptance/
          retention-days: 7
          if-no-files-found: ignore
