name: HexaWars persistence gate

on:
  pull_request:
    paths:
      - "src/persistence/**"
      - "tests/persistence/**"
      - ".github/workflows/persistence-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact PR commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: "1.3.3"
      - name: Restore locked dependencies
        run: bun install --frozen-lockfile
      - name: Verify persistence regressions
        run: bun test tests/persistence/
